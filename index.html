<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Favicons & Branding -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Primary SEO -->
    <title>IntegriQ IT</title>
    <meta
      name="description"
      content="IntegriQ IT empowers businesses and individuals with cutting-edge financial technology solutions. Driving innovation, efficiency, and growth through software and strategic partnerships."
    />
    <meta
      name="keywords"
      content="IntegriQ IT, fintech Bangladesh, financial technology, digital finance, fintech solutions, software development, business growth, innovative fintech company"
    />
    <meta name="author" content="IntegriQ IT" />

    <!-- Indexing Directives -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <link rel="canonical" href="https://integriqit.com" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta
      property="og:title"
      content="IntegriQ IT | Innovative Financial Technology Solutions"
    />
    <meta
      property="og:description"
      content="We provide innovative fintech solutions that transform businesses, foster growth, and empower individuals with technology-driven success."
    />
    <meta property="og:image" content="/logo.jpeg" />
    <meta property="og:url" content="https://integriqit.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="/logo.jpeg" />
    <meta
      name="twitter:title"
      content="IntegriQ IT | Empowering Businesses with Innovation"
    />
    <meta
      name="twitter:description"
      content="Discover how IntegriQ IT transforms industries with next-gen financial technology solutions."
    />
    <meta name="twitter:image" content="/logo.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
